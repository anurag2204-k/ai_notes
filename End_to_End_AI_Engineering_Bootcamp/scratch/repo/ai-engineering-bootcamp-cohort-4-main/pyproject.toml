[project]
name = "ai-engineering-bootcamp-prerequisites"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.57.0",
    "groq>=1.0.0",
    "ipykernel>=7.1.0",
    "openai>=2.15.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.52.2",
]

[tool.uv.workspace]
members = ["apps/api", "apps/chatbot_ui", "apps/reviews_mcp_server", "apps/items_mcp_server"]

[dependency-groups]
dev = [
    "cohere>=5.21.1",
    "instructor>=1.14.5",
    "langchain-openai>=1.1.9",
    "langgraph-checkpoint-postgres>=3.0.5",
    "langgraph>=1.1.3",
    "langsmith>=0.7.22",
    "matplotlib>=3.10.8",
    "qdrant-client>=1.17.1",
    "ragas>=0.4.3",
    "psycopg[binary]>=3.3.3",
    "fastmcp>=3.2.3",
    "langchain-mcp-adapters>=0.2.2",
]
